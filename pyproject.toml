[project]
name = "codebase-onboarding-agent"
version = "0.1.0"
description = "Point it at any git repo: forecasts which modules a newcomer will struggle with, builds a guided tour, and answers code-aware questions via hybrid search + an LLM agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gitpython>=3.1.43",
    "lizard>=1.17.10",
    "pathspec>=0.12.1",
    "numpy>=1.26",
    "chromadb>=0.5.5",
    "rank-bm25>=0.2.2",
    "groq>=0.11.0",
    "tavily-python>=0.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "mcp>=1.2.0",
]

[project.scripts]
onboard = "onboarding_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onboarding_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
